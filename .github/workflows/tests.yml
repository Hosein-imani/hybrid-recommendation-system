name: Pytest

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt -e ".[test]"

      - name: Run pytest
        run: python -m pytest
